name: CI

on:
  # Docs-only changes (Markdown, .ai/ metadata) skip CI entirely. Publishing is already gated on a
  # version bump, and a bump touches package.json, so it is never skipped.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.ai/**'
  # Only main: PR branches are already covered by pull_request, so this avoids running twice.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.ai/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke-test spawning npx.cmd
        shell: bash
        run: |
          node --input-type=module -e "
            import { spawnSync } from 'node:child_process';
            import { spawnSpec } from './dist/core.js';
            const s = spawnSpec({ command: 'npx.cmd', args: ['--version'] });
            const r = spawnSync(s.command, s.args, { stdio: 'inherit', shell: s.shell });
            if (r.error) throw r.error;
            process.exit(r.status ?? 1);
          "

  publish:
    needs: [build, windows]
    # Publish only after a merge into the default branch.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
